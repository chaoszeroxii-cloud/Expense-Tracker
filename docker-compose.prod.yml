version: '3.9'

# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Before running:
#   1. Create .env from .env.example and fill in real secrets
#   2. Set API_PUBLIC_URL to where the browser reaches the API. Leave it empty when
#      nginx proxies /api on the same origin (the default topology below) — the client
#      then uses a relative /api path and no CORS is involved at all.

services:
  db:
    ports: !reset []

  backend:
    build:
      target: production
    command: ["npm", "run", "start:prod"]
    volumes: !reset []
    ports: !reset []
    environment:
      NODE_ENV: production
      # nginx is one trusted hop. Increase only if all API routes have the same
      # trusted proxy chain and shorter direct routes are blocked.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

  frontend:
    build:
      target: production
      args:
        # The API's *public* origin, not the site's. These were the same variable
        # (`FRONTEND_URL`) before, which built a client that called itself. Empty is
        # the right default here: nginx proxies /api on this origin.
        VITE_API_URL:           ${API_PUBLIC_URL-}
        VITE_GOOGLE_CLIENT_ID:  ${VITE_GOOGLE_CLIENT_ID}
        VITE_FACEBOOK_APP_ID:   ${VITE_FACEBOOK_APP_ID}
    command: ["nginx", "-g", "daemon off;"]
    volumes: !reset []
    ports: !override
      - "3000:80"

  pgadmin:
    profiles: ["debug"]               # only starts with: --profile debug
