services:
  # ── Backend (NestJS) ─────────────────────────────────────────
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false          # วาง Neon connection string ใน Render dashboard
      - key: CORS_ORIGIN
        sync: false          # ใส่ URL ของ frontend หลัง deploy

  # ── Frontend (Static Site — ฟรี) ────────────────────────────
  - type: web
    name: expense-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # ใส่ URL ของ backend หลัง deploy
