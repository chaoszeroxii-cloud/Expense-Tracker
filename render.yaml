services:
  # ── Backend (NestJS) ─────────────────────────────────────────
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a random secret
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false                  # Set manually: https://expense-tracker-web.onrender.com

  # ── Frontend (React / Vite → Static Site) ───────────────────
  - type: web
    name: expense-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # SPA fallback (React Router)
    envVars:
      - key: VITE_API_URL
        sync: false                  # Set manually: https://expense-tracker-api.onrender.com

databases:
  # ── PostgreSQL ───────────────────────────────────────────────
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_user
