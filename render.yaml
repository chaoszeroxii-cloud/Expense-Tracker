services:
  # ── Backend (NestJS) — Node runtime (free tier) ──────────────
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false                  # Set manually after frontend deploys

  # ── Frontend (React / Vite → Static Site) ───────────────────
  - type: web
    name: expense-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false                  # Set manually after backend deploys

databases:
  # ── PostgreSQL ───────────────────────────────────────────────
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_user
