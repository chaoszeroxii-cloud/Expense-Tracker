# `Connection: upgrade` must only be sent when the client actually asked to upgrade;
# sending it unconditionally breaks keep-alive for every ordinary API call. This map
# sits at http level (conf.d/*.conf is included there) and resolves to "upgrade" or
# "close" per request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # base64 inflates a photo by ~33%, and the API accepts a 20 MB JSON body for
    # receipt uploads. nginx's 1 MB default rejected almost every phone photo with a
    # 413 before the request ever reached the backend.
    client_max_body_size 25m;

    # Security headers are included per-location, not declared once here.
    #
    # `add_header` does not accumulate across levels in nginx: a directive at one level
    # replaces every inherited one rather than adding to it. Every location below sets
    # its own Cache-Control, so a server-level declaration meant these headers were
    # never actually sent with a page, an asset, or the service worker — the whole set
    # was inert. Repeating the include is the only way to keep them.
    include /etc/nginx/conf.d/security-headers.inc;

    # Proxy /api to backend container
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;

        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # The chat endpoint streams SSE and can run five tool rounds against a model.
        # The 60s default read timeout cut those off mid-answer as a 504.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Never buffer an event stream. The backend also sends X-Accel-Buffering: no,
        # but be explicit rather than relying on the proxy honouring it.
        proxy_buffering off;
        proxy_cache off;
    }

    # Service worker — never cache
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed build assets — safe to cache forever
    location ~* \.(js|css|woff2|png|svg|ico|webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — everything else goes to index.html
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
